    cap_add:
      - NET_ADMIN
    tty: true

  server:
    build: ./server
    container_name: pqc_server
    hostname: server
    networks:
      server_net:
        ipv4_address: 192.168.0.10
    volumes:
      - ./certs:/certs
      - ./configs:/configs
      - ./results:/results
    cap_add:
      - NET_ADMIN
    tty: true

  monitor:
    build: ./monitor
    container_name: pqc_monitor
    hostname: monitor
    networks:
      client_net:
        ipv4_address: 172.20.0.2
      server_net:
        ipv4_address: 192.168.0.2
    volumes:
      - ./pcaps:/pcaps
      - ./results:/results
      - ./configs:/configs
    cap_add:
      - NET_ADMIN
      - NET_RAW
    tty: true

networks:
  client_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

  server_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.0.0/24
