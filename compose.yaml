services:
  client:
    build: ./client
    container_name: pqc_client
    hostname: client
    networks:
      client_net:
        ipv4_address: 172.20.0.10
    volumes:
      - ./certs:/certs
      - ./configs:/configs
      - ./results:/results
    cap_add:
      - NET_ADMIN
    tty: true

  pqc_client_2:
    build: ./client
    container_name: pqc_client_2
    hostname: client2
    networks:
      client_net:
        ipv4_address: 172.20.0.11
    volumes:
      - ./certs:/certs
      - ./configs:/configs
      - ./results:/results
    cap_add:
      - NET_ADMIN
    tty: true

  pqc_client_3:
    build: ./client
    container_name: pqc_client_3
    hostname: client3
    networks:
      client_net:
        ipv4_address: 172.20.0.12
    volumes:
      - ./certs:/certs
      - ./configs:/configs
      - ./results:/results
    cap_add:
      - NET_ADMIN
    tty: true

  pqc_client_4:
    build: ./client
    container_name: pqc_client_4
    hostname: client4
    networks:
      client_net:
        ipv4_address: 172.20.0.13
    volumes:
      - ./certs:/certs
      - ./configs:/configs
      - ./results:/results
    cap_add:
      - NET_ADMIN
    tty: true

  pqc_client_5:
    build: ./client
    container_name: pqc_client_5
    hostname: client5
    networks:
      client_net:
        ipv4_address: 172.20.0.14
    volumes:
      - ./certs:/certs
      - ./configs:/configs
      - ./results:/results
    cap_add:
      - NET_ADMIN
    tty: true

  pqc_client_6:
    build: ./client
    container_name: pqc_client_6
    hostname: client6
    networks:
      client_net:
        ipv4_address: 172.20.0.15
